<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalculatorApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Main Container -->
    <main class="main-container">

             <!-- WSA ICon -->
             <div class="wsaicon-container">
              <!-- WSA logc img -->
               <img src="wsa-logo.svg" alt="wsa-logo" class="wsaicon"/>
             </div>

             <!-- Titile and CalculatorContainer -->
           <div class="sub-container">

                    <!-- Title -->
                     <div class="header-container">
                       <h1 class="header">Calculator</h1>
                     </div>

                    <!-- Calculator container -->
                     <div class="calculator-container">

                             <!-- Background circle -->
                              <div class="background-circle"></div>

                            <!-- Calculator -->
                             <div class="calculator">

                                    <!-- i/p o/p screen -->
                                     <div class="output-field-container">
                                         <input type="text" class="output-field" id="display" readonly/>
                                         <input type="text" class="input-field" placeholder="0" id="input-screen" readonly/>
                                     </div>

                                     <!-- Button r0w 1-->
                                      <section class="btn-row">
                                        <button class="clear-icon bg-icon">AC</button>
                                        <button class="delete-icon bg-icon"><=</button>
                                        <button class="percentage-icon bg-icon">%</button>
                                      </section>

                                       <!-- New Button row-->
                                      <section class="btn-row">
                                        <button>(</button>
                                        <button>)</button>
                                        <button class="power-icon bg-icon">^</button>
                                        <button class="toggle-sign-icon bg-icon">+/-</button>
                                        <button class="squareroot-icon bg-icon">sqt</button>
                                      </section>

                                      <!-- button row 2 -->
                                       <section class="btn-row">
                                        <button>7</button>
                                        <button>8</button>
                                        <button>9</button>
                                        <button class="divide-icon bg-icon">/</button>
                                        <button class="mod-icon bg-icon">Mod</button>
                                        
                                       </section>

                                      <!-- Button row 3 -->
                                       <section class="btn-row">
                                        <button>4</button>
                                        <button>5</button>
                                        <button>6</button>
                                        <button class="multiply-icon bg-icon">x</button>
                                        <button class="bg-icon reciprocal-icon">1/x</button>
                                        
                                      </section>

                                      <!-- Button row 4 -->
                                       <section class="btn-row">
                                        <button>1</button>
                                        <button>2</button>
                                        <button>3</button>
                                        <button class="add-icon bg-icon">+</button>
                                        <button class="minus-icon bg-icon">-</button>
                                       </section>

                                       <!-- Button row 5 -->
                                        <section class="btn-row">
                                          <button class="zero">0</button>
                                          <button>.</button>
                                          <button class="equal-icon bg-icon">=</button>
                                        </section>

                     </div>
                </div>

            </div>

            <footer class="footer-name">&copy;© 2023 WSA. All Rights Reserved</footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
